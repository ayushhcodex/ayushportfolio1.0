<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>503 Service Unavailable</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 2rem;
      border-radius: 8px;
      background-color: #1e1e1e;
      border: 1px solid #333;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 4rem;
      margin: 0 0 10px 0;
      color: #ff4a4a;
    }
    h2 {
      font-size: 2rem;
      margin: 0 0 20px 0;
    }
    p {
      color: #a0a0a0;
      max-width: 400px;
      margin: 0 auto;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>503</h1>
    <h2>Service Unavailable</h2>
    <p>We are currently undergoing scheduled maintenance to improve our services. Please check back soon.</p>
  </div>
</body>
</html>
